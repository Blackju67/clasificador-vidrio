name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
        max-size: 2G

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev
        pip install --upgrade buildozer cython

    - name: Configure and Build APK
      env:
        USE_CCACHE: 1
        CCACHE_DIR: ~/.ccache
      run: |
        # Generar buildozer.spec si no existe
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

        # Modificar parámetros clave en buildozer.spec para evitar errores de NDK
        sed -i 's/android.archs =.*/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/# android.ndk =.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/log_level =.*/log_level = 2/' buildozer.spec

        # Aceptar licencias de Android automáticamente
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android debug || true

        # Ejecución principal
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GlassClassifier-APK
        path: bin/*.apk
