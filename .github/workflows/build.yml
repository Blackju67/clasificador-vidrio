name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. Configuración explícita de ccache para C/C++
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
        max-size: 2G

    # 2. Instalación de dependencias del sistema operativo
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev
        pip install --upgrade buildozer cython

    # 3. Compilación de la APK
    - name: Build APK with Buildozer
      env:
        USE_CCACHE: 1
        CCACHE_DIR: ~/.ccache
      run: |
        buildozer android debug

    # 4. Generación del artefacto para descargar
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GlassClassifier-APK
        path: bin/*.apk
